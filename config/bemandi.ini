[video]
; Standard NDI High Bandwidth. No NVENC or Advanced SDK dependency.
; uyvy: GPU conversion / half-size readback. bgra: simple copy baseline.
format=uyvy
fps=120
width=1920
height=1080
swapchain=0
source_name=IIDX Main
; Empty searches installed NDI 6 Runtime/Tools (not the current directory).
ndi_runtime=

[audio]
; Independent stereo 44100 Hz PCM source from the verified game's native mixer.
; Unknown game builds disable audio safely; video remains available.
enabled=1
source_name=IIDX Audio
